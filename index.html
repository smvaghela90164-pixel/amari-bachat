    <!-- Lucide Icons -->

<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 selection:bg-emerald-500 selection:text-white overflow-x-auto">

    <!-- Cloud Sync Status Banner -->
    <div id="syncBadge" class="fixed bottom-3 right-3 z-50 bg-slate-900/90 border border-slate-700 px-3 py-1.5 rounded-full text-[11px] flex items-center gap-2 shadow-lg backdrop-blur-md">
        <span id="syncDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="syncText" class="text-slate-300">Connecting to Cloud...</span>
    </div>

    <div id="app" class="min-w-[1150px] max-w-7xl mx-auto px-4 py-6 animate-fade-in"></div>

    <!-- Firebase SDK (Modular v11 via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCYGVycm5lNTZsP_mm_t-i94Ss8Oi8E34",
            authDomain: "easy-life-2646e.firebaseapp.com",
            databaseURL: "https://easy-life-2646e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "easy-life-2646e",
            storageBucket: "easy-life-2646e.firebasestorage.app",
            messagingSenderId: "605500823110",
            appId: "1:605500823110:web:c2bc12d1c2d4d2606f1c47",
            measurementId: "G-P92HZ2GP7E"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getDatabase(firebaseApp);
        const sharedDataRef = ref(db, "amari_bachat_suraksha_shared");

        window.dbSync = {
            saveSharedData: async function(sharedPayload) {
                try {
                    updateSyncStatus("saving");
                    await set(sharedDataRef, sharedPayload);
                    updateSyncStatus("connected");
                } catch (err) {
                    console.error("Firebase Save Error:", err);
                    updateSyncStatus("error");
                    alert("Cloud save error: Internet ya Firebase Rules check karein.");
                }
            }
        };

        function updateSyncStatus(state) {
            const dot = document.getElementById("syncDot");
            const text = document.getElementById("syncText");
            if (!dot || !text) return;
            if (state === "connected") {
                dot.className = "w-2 h-2 rounded-full bg-emerald-400";
                text.innerText = "Live Cloud Connected";
            } else if (state === "saving") {
                dot.className = "w-2 h-2 rounded-full bg-indigo-400 animate-ping";
                text.innerText = "Syncing...";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-rose-500";
                text.innerText = "Offline / Sync Error";
            }
        }

        // Initial load & real-time listener for all devices
        onValue(sharedDataRef, (snapshot) => {
            updateSyncStatus("connected");
            if (snapshot.exists()) {
                const cloudData = snapshot.val();
                window.applyCloudData(cloudData);
            } else {
                window.pushInitialDataToCloud();
            }
        }, (error) => {
            console.error("Firebase Read Error:", error);
            updateSyncStatus("error");
        });
    </script>

    <script>
        const STORAGE_KEY = "amari_bachat_suraksha_v31";
        const SESSION_KEY = "amari_bachat_session_v1";
        const DEFAULT_MEMBER_PHOTO = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";

        let sessionState = JSON.parse(sessionStorage.getItem(SESSION_KEY)) || {
            currentUser: null,
            activeTab: "dashboard",
            viewMode: "desktop"
        };
        if (!sessionState.viewMode) sessionState.viewMode = "desktop";

        const defaultSharedData = {
            adminCreds: { username: "admin", password: "admin123", displayName: "Main Admin", role: "Super Admin" },
            adminBalances: [
                { id: 1, name: "Main Admin", amount: 0 }
            ],
            paymentSettings: {
                upiId: "groupadmin@upi",
                qrImageUrl: "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=groupadmin@upi&pn=AmariBachatAmariSuraksha&am=500&cu=INR"
            },
            whatsappTemplates: {
                reminderMsg: "Hello {name},\n'અમારી બચત | અમારી સુરક્ષા' ગ્રુપની {month} ની ₹{amount} સેવિંગ્સ જમા કરવાની છેલ્લી તારીખ ૧૦ તારીખ છે. કૃપા કરીને સમયસર પેમેન્ટ કરો જેથી ₹50 પેનલ્ટીથી બચી શકાય. UPI ID: {upi}\nધન્યવાદ!"
            },
            currentMonth: "2026-11",
            members: [
                { id: 1, name: "Aarav Sharma", age: 28, phone: "9876543210", pin: "1111", photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150", joinMonth: "2026-01" },
                { id: 2, name: "Rohan Verma", age: 32, phone: "9876543211", pin: "2222", photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150", joinMonth: "2026-01" },
                { id: 3, name: "Amit Patel", age: 25, phone: "9876543212", pin: "3333", photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150", joinMonth: "2026-02" },
                { id: 4, name: "Priya Singh", age: 29, phone: "9876543213", pin: "4444", photo: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150", joinMonth: "2026-02" }
            ],
            savings: {},
            loans: [],
            expenses: [],
            queries: []
        };

        function sanitizePhotoUrl(rawUrl) {
            if (!rawUrl || typeof rawUrl !== "string") return DEFAULT_MEMBER_PHOTO;
            let cleaned = rawUrl.trim().replace(/^["']+|["']+$/g, "").trim();
            if (!cleaned) return DEFAULT_MEMBER_PHOTO;
            if (cleaned.startsWith("http://") || cleaned.startsWith("https://") || cleaned.startsWith("data:image/")) {
                return cleaned;
            }
            return DEFAULT_MEMBER_PHOTO;
        }

        function escapeAttr(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function formatMonthMMYYYY(yyyymm) {
            if (!yyyymm || typeof yyyymm !== "string") return "-";
            const parts = yyyymm.split("-");
            if (parts.length === 2 && parts[0].length === 4) {
                return `${parts[1].padStart(2, "0")}-${parts[0]}`;
            }
            return yyyymm;
        }

        let localCached = JSON.parse(localStorage.getItem(STORAGE_KEY));
        let appData = {
            ...defaultSharedData,
            ...(localCached || {}),
            currentUser: sessionState.currentUser,
            activeTab: sessionState.activeTab
        };

        function normalizeAppData() {
            if (!appData.adminCreds) appData.adminCreds = defaultSharedData.adminCreds;
            if (!Array.isArray(appData.adminBalances) || appData.adminBalances.length === 0) {
                appData.adminBalances = [{ id: 1, name: appData.adminCreds.displayName || "Main Admin", amount: 0 }];
            }
            if (!appData.paymentSettings) appData.paymentSettings = defaultSharedData.paymentSettings;
            if (!appData.whatsappTemplates) appData.whatsappTemplates = defaultSharedData.whatsappTemplates;
            if (!appData.currentMonth) appData.currentMonth = "2026-11";
            if (!Array.isArray(appData.members)) appData.members = defaultSharedData.members;
            if (!appData.savings || typeof appData.savings !== 'object') appData.savings = {};
            if (!Array.isArray(appData.loans)) appData.loans = [];
            if (!Array.isArray(appData.expenses)) appData.expenses = [];
            if (!Array.isArray(appData.queries)) appData.queries = [];

            appData.loans.forEach(l => {
                if (!Array.isArray(l.repayments)) l.repayments = [];
                if (typeof l.deleted !== 'boolean') l.deleted = false;
            });

            appData.members.forEach((m, idx) => {
                if (!m.age) m.age = 30;
                if (!m.pin) m.pin = String(1111 + idx);
                m.photo = sanitizePhotoUrl(m.photo);
                if (!m.joinMonth) m.joinMonth = "2026-01";
            });
        }

        normalizeAppData();

        function applyViewModeLayout() {
            const root = document.getElementById("app");
            if (!root) return;
            if (sessionState.viewMode === "desktop") {
                root.className = "min-w-[1150px] max-w-7xl mx-auto px-4 py-6 animate-fade-in";
            } else {
                root.className = "w-full max-w-7xl mx-auto px-4 py-6 animate-fade-in";
            }
        }

        function toggleViewMode() {
            sessionState.viewMode = sessionState.viewMode === "desktop" ? "mobile" : "desktop";
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionState));
            render();
        }

        function getSharedPayload() {
            return {
                adminCreds: appData.adminCreds,
                adminBalances: appData.adminBalances,
                paymentSettings: appData.paymentSettings,
                whatsappTemplates: appData.whatsappTemplates,
                currentMonth: appData.currentMonth,
                members: appData.members,
                savings: appData.savings,
                loans: appData.loans,
                expenses: appData.expenses,
                queries: appData.queries
            };
        }

        window.applyCloudData = function(cloudData) {
            appData = {
                ...defaultSharedData,
                ...cloudData,
                currentUser: sessionState.currentUser,
                activeTab: sessionState.activeTab
            };
            normalizeAppData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(getSharedPayload()));
            render();
        };

        window.pushInitialDataToCloud = function() {
            normalizeAppData();
            if (window.dbSync) {
                window.dbSync.saveSharedData(getSharedPayload());
            }
        };

        let myChartInstance = null;

        function saveSessionOnly() {
            sessionState.currentUser = appData.currentUser;
            sessionState.activeTab = appData.activeTab;
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionState));
            render();
        }

        function saveAppData() {
            normalizeAppData();
            const payload = getSharedPayload();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            if (window.dbSync) {
                window.dbSync.saveSharedData(payload);
            }
            render();
        }

        function render() {
            applyViewModeLayout();
            const root = document.getElementById("app");
            if (!appData.currentUser) {
                root.innerHTML = renderLoginScreen();
            } else {
                root.innerHTML = renderMainApp();
                if (appData.activeTab === 'dashboard') {
                    initDashboardCharts();
                }
            }
            lucide.createIcons();
        }

        function renderLoginScreen() {
            const isDesktopMode = sessionState.viewMode === "desktop";
            return `
                <div class="min-h-[85vh] flex items-center justify-center animate-fade-in">
                    <div class="bg-slate-900/95 backdrop-blur-2xl border border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
                        <div class="inline-flex p-4 bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 rounded-2xl mb-4 shadow-inner animate-pulse">
                            <i data-lucide="shield-check" class="w-12 h-12"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-emerald-300 tracking-wide">અમારી બચત <span class="text-amber-400">|</span> અમારી સુરક્ષા</h1>
                        <p class="text-slate-400 text-xs font-semibold uppercase tracking-widest mt-1 mb-4">Savings & Loan Management Portal</p>

                        <div class="mb-5">
                            <button onclick="toggleViewMode()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 transition">
                                <i data-lucide="${isDesktopMode ? 'smartphone' : 'monitor'}" class="w-3.5 h-3.5"></i>
                                ${isDesktopMode ? 'Switch to Mobile View' : 'Switch to Desktop Wide View'}
                            </button>
                        </div>

                        <div class="space-y-6 text-left">
                            <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
                                <h3 class="font-semibold text-indigo-300 mb-3 flex items-center gap-2"><i data-lucide="user-cog" class="w-5 h-5"></i> Admin Login</h3>
                                <div class="space-y-3">
                                    <input type="text" id="adminUser" placeholder="Username" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                                    <input type="password" id="adminPass" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                                    <button onclick="handleAdminLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">Login as Admin</button>
                                </div>
                            </div>

                            <div class="relative flex py-1 items-center">
                                <div class="flex-grow border-t border-slate-700"></div>
                                <span class="flex-shrink mx-4 text-slate-500 text-xs uppercase">Ya Member View (PIN Required)</span>
                                <div class="flex-grow border-t border-slate-700"></div>
                            </div>

                            <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
                                <h3 class="font-semibold text-emerald-300 mb-3 flex items-center gap-2"><i data-lucide="lock" class="w-5 h-5"></i> Member Login</h3>
                                <div class="space-y-3">
                                    <select id="selectedMember" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                                        <option value="">Apna Naam Chunein...</option>
                                        ${appData.members.map(m => `<option value="${escapeAttr(m.name)}">${escapeAttr(m.name)}</option>`).join('')}
                                    </select>
                                    <input type="password" id="memberPin" maxlength="8" placeholder="Apna Personal PIN Dalein" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                                    <button onclick="handleMemberLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-emerald-600/30">Verify PIN & View My Account</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAdminLogin() {
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            if (u === appData.adminCreds.username && p === appData.adminCreds.password) {
                appData.currentUser = { role: 'admin' };
                appData.activeTab = 'dashboard';
                saveSessionOnly();
            } else {
                alert('Galat Username ya Password!');
            }
        }

        function handleMemberLogin() {
            const name = document.getElementById('selectedMember').value;
            const pinInput = document.getElementById('memberPin').value.trim();
            if (!name) { alert('Kripya apna naam select karein.'); return; }
            if (!pinInput) { alert('Kripya apna personal PIN dalein.'); return; }

            const memberObj = appData.members.find(m => m.name === name);
            if (!memberObj || String(memberObj.pin || "") !== pinInput) {
                alert('Galat PIN! Aap sirf apna account hi apne PIN se khol sakte hain.');
                return;
            }

            appData.currentUser = { role: 'member', name: memberObj.name, memberId: memberObj.id };
            appData.activeTab = 'dashboard';
            saveSessionOnly();
        }

        function logout() {
            appData.currentUser = null;
            saveSessionOnly();
        }

        function renderMainApp() {
            const isAdmin = appData.currentUser.role === 'admin';
            const isDesktopMode = sessionState.viewMode === "desktop";
            return `
                <header class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-4 mb-6 flex flex-wrap justify-between items-center gap-4 shadow-xl">
                    <div class="flex items-center gap-3 bg-slate-800/80 px-4 py-2 rounded-2xl border border-emerald-500/30 shadow-inner">
                        <div class="p-2 bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 rounded-xl">
                            <i data-lucide="shield-check" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="text-sm md:text-base font-bold text-emerald-300 tracking-wider">અમારી બચત <span class="text-amber-400">|</span> અમારી સુરક્ષા</h1>
                            <p class="text-[11px] text-slate-400">${isAdmin ? '👑 Admin: ' + escapeAttr(appData.adminCreds.displayName) : '🔒 Member: ' + escapeAttr(appData.currentUser.name)}</p>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-2 items-center">
                        <button onclick="setTab('dashboard')" class="px-3.5 py-2 rounded-xl text-xs font-medium transition ${appData.activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Dashboard</button>
                        <button onclick="setTab('members')" class="px-3.5 py-2 rounded-xl text-xs font-medium transition ${appData.activeTab === 'members' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${isAdmin ? 'Members' : 'My Profile'}</button>
                        <button onclick="setTab('deadline')" class="px-3.5 py-2 rounded-xl text-xs font-medium transition ${appData.activeTab === 'deadline' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">🔔 1-10 Rule</button>
                        <button onclick="openUpiQrModal()" class="px-3.5 py-2 rounded-xl text-xs font-medium bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white transition flex items-center gap-1.5"><i data-lucide="qr-code" class="w-4 h-4"></i> UPI QR</button>
                        <button onclick="setTab('loans')" class="px-3.5 py-2 rounded-xl text-xs font-medium transition ${appData.activeTab === 'loans' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Loans</button>
                        <button onclick="setTab('expenses')" class="px-3.5 py-2 rounded-xl text-xs font-medium transition ${appData.activeTab === 'expenses' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Penalties</button>
                        <button onclick="setTab('audit')" class="px-3.5 py-2 rounded-xl text-xs font-medium transition ${appData.activeTab === 'audit' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Audit</button>
                        <button onclick="setTab('queries')" class="px-3.5 py-2 rounded-xl text-xs font-medium transition ${appData.activeTab === 'queries' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Chat</button>
                        <button onclick="toggleViewMode()" class="px-3 py-2 rounded-xl text-xs font-medium bg-cyan-600/20 text-cyan-300 border border-cyan-500/30 hover:bg-cyan-600 hover:text-white transition flex items-center gap-1.5" title="Toggle Desktop / Mobile Screen Layout">
                            <i data-lucide="${isDesktopMode ? 'smartphone' : 'monitor'}" class="w-4 h-4"></i>
                            ${isDesktopMode ? 'Mobile View' : 'Desktop View'}
                        </button>
                        ${isAdmin ? `<button onclick="openSettingsModal()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition" title="Admin Settings"><i data-lucide="settings" class="w-5 h-5"></i></button>` : ''}
                        <button onclick="logout()" class="px-3 py-2 bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white rounded-xl text-xs font-medium transition" title="Logout"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                    </div>
                </header>

                <main class="animate-fade-in">
                    ${appData.activeTab === 'dashboard' ? renderDashboard() : ''}
                    ${appData.activeTab === 'members' ? renderMembersTab() : ''}
                    ${appData.activeTab === 'deadline' ? renderDeadlineTab() : ''}
                    ${appData.activeTab === 'loans' ? renderLoansTab() : ''}
                    ${appData.activeTab === 'expenses' ? renderExpensesTab() : ''}
                    ${appData.activeTab === 'audit' ? renderAuditTab() : ''}
                    ${appData.activeTab === 'queries' ? renderQueriesTab() : ''}
                </main>

                <!-- Admin Amount Add / Edit Modal -->
                <div id="adminBalanceModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-md space-y-4 shadow-2xl animate-scale-in">
                        <h3 id="adminBalanceModalTitle" class="text-lg font-bold text-white">Add Admin Amount</h3>
                        <input type="hidden" id="editAdminBalanceId">
                        <div>
                            <label class="text-xs text-slate-300 mb-1 block">Admin Name</label>
                            <input type="text" id="adminBalanceName" placeholder="e.g. Co-Admin / Suresh Bhai" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="text-xs text-slate-300 mb-1 block">Amount with Admin (₹)</label>
                            <input type="number" id="adminBalanceAmount" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none">

                if (!entry) return;
                document.getElementById('editAdminBalanceId').value = entry.id;

        function saveAdminBalanceEntry() {
            if (appData.currentUser.role !== 'admin') return;
            const idVal = document.getElementById('editAdminBalanceId').value;
            const nameVal = document.getElementById('adminBalanceName').value.trim();
            const amountVal = parseFloat(document.getElementById('adminBalanceAmount').value);

            if (!nameVal || isNaN(amountVal)) {
                alert('Kripya Admin ka naam aur valid amount bharein.');
                return;
            }

            if (idVal) {
                const entry = appData.adminBalances.find(a => a.id === parseInt(idVal));
                if (entry) {
                    entry.name = nameVal;
                    entry.amount = amountVal;
                }
            } else {
                const newId = appData.adminBalances.length > 0
                    ? Math.max(...appData.adminBalances.map(a => a.id)) + 1
                    : 1;
                appData.adminBalances.push({ id: newId, name: nameVal, amount: amountVal });
            }

            closeAdminBalanceModal();
            saveAppData();
        }

        function deleteAdminBalanceEntry(id) {
            if (appData.currentUser.role !== 'admin') return;
            if (appData.adminBalances.length <= 1) {

            if (confirm('Kya aap is admin entry ko hatana chahte hain?')) {

        function exportBackupJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getSharedPayload(), null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `Amari_Bachat_Suraksha_Backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();

        function importBackupJSON() {
            const fileInput = document.getElementById('importFile');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Kripya pehle ek JSON backup file select karein!');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (importedData && importedData.members) {
                        if (confirm('Kya aap sach mein yeh data restore karna chahte hain? Sabhi devices par yeh naya data update ho jayega.')) {
                            appData = {
                                ...defaultSharedData,
                                ...importedData,
                                currentUser: sessionState.currentUser,
                                activeTab: sessionState.activeTab
                            };
                            closeSettingsModal();
                            saveAppData();
                            alert('Data successfully cloud par restore ho gaya hai!');
                        }
                    } else {
                        alert('Yeh file valid "અમારી બચત" backup file nahi hai!');
                    }
                } catch (error) {
                    alert('JSON file read karne mein error aayi hai: ' + error.message);
                }
            };

            reader.readAsText(file);
        }

        function exportExcelAudit() {
            let data = appData.members.map((m, idx) => {
                let mMonths = 0;
                Object.keys(appData.savings).forEach(k => {
                    if (k.endsWith(`_${m.id}`)) {
                        let val = appData.savings[k];
                        if (val === true) mMonths++;
                        else if (typeof val === 'object' && val.paid) {
                            mMonths += (1 + (val.advanceMonths || 0));
                        }
                    }
                });
                let mSavings = mMonths * 500;
                let mInterestPaid = 0;
                appData.loans.filter(l => l.memberName === m.name).forEach(l => {
                    (l.repayments || []).forEach(r => { if (r.type === 'Interest') mInterestPaid += r.amount; });
                });
                return {
                    "#": idx + 1,
                    "Member Name": m.name,
                    "Age": m.age,
                    "Mobile Phone": m.phone,
                    "Join Month": formatMonthMMYYYY(m.joinMonth || "2026-01"),
                    "Total Personal Savings (Rs)": mSavings,
                    "Interest Paid (Rs)": mInterestPaid
                };
            });

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Annual Audit Summary");
            XLSX.writeFile(wb, `Amari_Bachat_Suraksha_Audit_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function downloadDashboardMetricPDF(metricKey) {
            const jsPDFRef = window.jspdf && window.jspdf.jsPDF;
            if (!jsPDFRef) {
                alert("PDF library abhi load nahi hui, page refresh karke dobara try karein.");
                return;
            }
            const doc = new jsPDFRef();

            let totalSavingsCount = 0;
            let savingsRows = [];
            Object.keys(appData.savings).sort().forEach(k => {
                let val = appData.savings[k];
                let parts = k.split('_');
                let mId = parseInt(parts.pop());
                let rawMonthKey = parts.join('_');
                let formattedMonth = formatMonthMMYYYY(rawMonthKey);
                let member = appData.members.find(x => x.id === mId);
                let mName = member ? member.name : `Member #${mId}`;

                if (val === true) {
                    totalSavingsCount += 1;
                    savingsRows.push([mName, formattedMonth, "1 Month (Paid)", "Rs. 500"]);
                } else if (val && typeof val === 'object' && val.paid) {
                    let adv = parseInt(val.advanceMonths) || 0;
                    let monthsCredited = 1 + adv;
                    totalSavingsCount += monthsCredited;
                    savingsRows.push([mName, formattedMonth, `1 Paid + ${adv} Adv (${monthsCredited}M)`, `Rs. ${monthsCredited * 500}`]);
                }
            });
            let totalSavings = totalSavingsCount * 500;

            let totalInterest = 0;
            let interestRows = [];
            appData.loans.forEach(l => {
                (l.repayments || []).forEach(r => {
                    if (r.type === 'Interest') {
                        let amt = parseFloat(r.amount) || 0;
                        totalInterest += amt;
                        interestRows.push([
                            r.date || l.date || "-",
                            l.memberName,
                            `Loan #${l.id} (Amt: Rs. ${l.amount})`,
                            l.deleted ? "Deleted Loan" : "Active Loan",
                            `Rs. ${amt}`
                        ]);
                    }
                });
            });

            let activeLoansTotal = 0;
            let activeLoanRows = [];
            appData.loans.filter(l => !l.deleted && l.status === 'Active').forEach(l => {
                let repaidPrincipal = (l.repayments || []).reduce((sum, r) => r.type === 'Principal' ? sum + (parseFloat(r.amount) || 0) : sum, 0);
                let balance = (parseFloat(l.amount) || 0) - repaidPrincipal;
                if (balance > 0) {
                    activeLoansTotal += balance;
                    activeLoanRows.push([
                        l.memberName,
                        l.date || "-",
                        `Rs. ${l.amount}`,
                        `Rs. ${repaidPrincipal}`,
                        `Rs. ${balance}`
                    ]);
                }
            });

            let totalPenaltiesNet = appData.expenses.reduce((acc, e) => {
                let amt = parseFloat(e.amount) || 0;
                return e.type === 'Income' ? acc + amt : acc - amt;
            }, 0);
            let netTotalFund = totalSavings + totalInterest + totalPenaltiesNet;
            let availableCash = netTotalFund - activeLoansTotal;

            doc.setFillColor(16, 185, 129);
            doc.rect(0, 0, 210, 32, "F");
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(15);
            doc.text("Amari Bachat | Amari Suraksha - Dashboard Report", 14, 20);

            doc.setTextColor(40, 40, 40);
            doc.setFontSize(10);
            doc.text(`Generated Date: ${new Date().toISOString().split('T')[0]} | Current Month: ${formatMonthMMYYYY(appData.currentMonth)}`, 14, 41);

            let title = "";
            let summaryLines = [];
            let headers = [];
            let bodyRows = [];
            let fileName = "Dashboard_Report.pdf";

            if (metricKey === "savings") {
                title = "Total Savings Breakdown Report";
                summaryLines = [
                    `Calculation: ${totalSavingsCount} Months x Rs. 500 = Rs. ${totalSavings}`,
                    `Total Savings: Rs. ${totalSavings}`
                ];
                headers = ["Member Name", "Month (MM-YYYY)", "Months Credited", "Amount"];
                bodyRows = savingsRows.length > 0 ? savingsRows : [["-", "-", "No savings entries", "Rs. 0"]];
                fileName = "Total_Savings_Report.pdf";
            } else if (metricKey === "interest") {
                title = "Interest Earned Breakdown Report";
                summaryLines = [
                    `Calculation: Sum of all Interest repayments across loans`,
                    `Total Interest Earned: Rs. ${totalInterest}`
                ];
                headers = ["Date", "Member Name", "Loan Reference", "Loan Status", "Interest Amount"];
                bodyRows = interestRows.length > 0 ? interestRows : [["-", "-", "-", "No interest entries", "Rs. 0"]];
                fileName = "Interest_Earned_Report.pdf";
            } else if (metricKey === "active_loans") {
                title = "Active Loans Out Report";
                summaryLines = [
                    `Calculation: Sum of pending principal on non-deleted Active loans`,
                    `Total Active Loans Out: Rs. ${activeLoansTotal}`
                ];
                headers = ["Member Name", "Issue Date", "Loan Amount", "Principal Repaid", "Balance Due"];
                bodyRows = activeLoanRows.length > 0 ? activeLoanRows : [["-", "-", "-", "-", "No active loans"]];
                fileName = "Active_Loans_Out_Report.pdf";
            } else if (metricKey === "available_cash") {
                title = "Available Cash Report";
                summaryLines = [
                    `Available Cash = Net Total Fund (Rs. ${netTotalFund}) - Active Loans Out (Rs. ${activeLoansTotal}) = Rs. ${availableCash}`
                ];
                headers = ["Component", "Details", "Amount"];
                bodyRows = [
                    ["Total Savings", `${totalSavingsCount} months x Rs. 500`, `Rs. ${totalSavings}`],
                    ["Interest Earned", "All interest repayments", `Rs. ${totalInterest}`],
                    ["Net Penalties", "Penalty income minus expenses", `Rs. ${totalPenaltiesNet}`],
                    ["Less: Active Loans Out", "Pending principal on active loans", `- Rs. ${activeLoansTotal}`],
                    ["Available Cash", "Final cash available", `Rs. ${availableCash}`]
                ];
                fileName = "Available_Cash_Report.pdf";
            } else if (metricKey === "net_fund") {
                title = "Net Total Fund Report";
                summaryLines = [
                    `Net Total Fund = Savings (Rs. ${totalSavings}) + Interest (Rs. ${totalInterest}) + Net Penalties (Rs. ${totalPenaltiesNet}) = Rs. ${netTotalFund}`
                ];
                headers = ["Fund Source", "Basis", "Amount"];
                bodyRows = [
                    ["Total Savings", `${totalSavingsCount} paid/advance months`, `Rs. ${totalSavings}`],
                    ["Interest Earned", "Interest repayments received", `Rs. ${totalInterest}`],
                    ["Net Penalties", "Penalties/Income minus Expense", `Rs. ${totalPenaltiesNet}`],
                    ["Net Total Fund", "Combined fund total", `Rs. ${netTotalFund}`]
                ];
                fileName = "Net_Total_Fund_Report.pdf";
            } else {
                alert("Unknown report type.");
                return;
            }

            doc.setFontSize(13);
            doc.setTextColor(15, 23, 42);
            doc.text(title, 14, 52);

            doc.setFontSize(10);
            doc.setTextColor(51, 65, 85);
            let yPos = 60;
            summaryLines.forEach(line => {
                doc.text(line, 14, yPos);
                yPos += 7;
            });

            doc.autoTable({
                head: [headers],
                body: bodyRows,
                startY: yPos + 4
            });

            doc.save(fileName);
        }

        function checkMemberPaidStatus(memberId, targetMonth) {
            let directKey = `${targetMonth}_${memberId}`;
            if (appData.savings[directKey] === true || (typeof appData.savings[directKey] === 'object' && appData.savings[directKey].paid)) {
                return { status: true, type: 'Paid' };
            }

            let [tYear, tMonth] = targetMonth.split('-').map(Number);
            for (let m = 1; m <= 12; m++) {
                let checkDate = new Date(tYear, tMonth - 1 - m, 1);
                let yStr = checkDate.getFullYear();
                let mStr = String(checkDate.getMonth() + 1).padStart(2, '0');
                let pastMonthKey = `${yStr}-${mStr}_${memberId}`;
                
                let val = appData.savings[pastMonthKey];
                if (val && typeof val === 'object' && val.advanceMonths) {
                    let advCount = val.advanceMonths;
                    let diffMonths = (tYear - yStr) * 12 + (tMonth - parseInt(mStr));
                    if (diffMonths > 0 && diffMonths <= advCount) {
                        return { status: true, type: 'Advance Adjusted' };
                    }
                }
            }
            return { status: false, type: 'Pending' };
        }

        function autoApplyLatePenalties() {
            let count = 0;
            appData.members.forEach(m => {
                let res = checkMemberPaidStatus(m.id, appData.currentMonth);
                if (!res.status) {
                    let penaltyTitle = `Late Savings Penalty - ${m.name} (${appData.currentMonth})`;
                    let alreadyExists = appData.expenses.some(e => e.title === penaltyTitle);
                    if (!alreadyExists) {
                        appData.expenses.push({
                            id: Date.now() + Math.floor(Math.random() * 1000),
                            title: penaltyTitle,
                            amount: 50,
                            type: 'Income',
                            date: new Date().toISOString().split('T')[0]
                        });
                        count++;
                    }
                }
            });
            alert(`${count} pending members par ₹50 late penalty apply kar di gayi hai!`);
            saveAppData();
        }

        function downloadMemberPassbookPDF(memberId) {
            let m = appData.members.find(x => x.id === memberId);
            if (!m) return;

            let memberTotalPaidMonths = 0;
            Object.keys(appData.savings).forEach(k => {
                if (k.endsWith(`_${m.id}`)) {
                    let val = appData.savings[k];
                    if (val === true) memberTotalPaidMonths++;
                    else if (typeof val === 'object' && val.paid) {
                        memberTotalPaidMonths += (1 + (val.advanceMonths || 0));
                    }
                }
            });
            let totalSavings = memberTotalPaidMonths * 500;
            let mLoans = appData.loans.filter(l => l.memberName === m.name);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(16, 185, 129);
            doc.rect(0, 0, 210, 32, "F");
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.text("Amari Bachat | Amari Suraksha - Passbook", 14, 21);

            doc.setTextColor(50, 50, 50);
            doc.setFontSize(11);
            doc.text(`Member Name: ${m.name} (Age: ${m.age} yrs)`, 14, 45);
            doc.text(`Phone Number: ${m.phone}`, 14, 53);
            doc.text(`Join Month: ${formatMonthMMYYYY(m.joinMonth || '2026-01')}`, 14, 61);
            doc.text(`Total Personal Savings Accumulated: Rs. ${totalSavings}`, 14, 69);

            let loanRows = [];
            mLoans.forEach(l => {
                (l.repayments || []).forEach(r => {
                    loanRows.push([r.date, `Rs. ${l.amount}`, `Rs. ${r.amount}`, r.type]);
                });
            });

            if (loanRows.length > 0) {
                doc.autoTable({
                    head: [['Date', 'Original Loan', 'Amount Repaid', 'Repayment Type']],
                    body: loanRows,
                    startY: 78
                });
            } else {
                doc.text("No active or historical loan transactions found.", 14, 82);
            }

            doc.save(`Passbook_${m.name.replace(/\s+/g, '_')}.pdf`);
        }

        function changeMonth(val) { appData.currentMonth = val; saveAppData(); }
        
        function toggleSavings(id) {
            if (appData.currentUser.role !== 'admin') { alert('Sirf Admin hi status change kar sakta hai!'); return; }
            let key = `${appData.currentMonth}_${id}`;
            let current = appData.savings[key];
            if (current && typeof current === 'object') {
                appData.savings[key] = !current.paid;
            } else {
                appData.savings[key] = !current;
            }
            saveAppData();
        }

        function openAdvanceModal(id, name) {
            if (appData.currentUser.role !== 'admin') return;
            document.getElementById('advMemberId').value = id;
            document.getElementById('advMemberNameDisplay').innerText = `Member: ${name} (Current Month: ${formatMonthMMYYYY(appData.currentMonth)})`;
            document.getElementById('advMonthsCount').value = "1";
            document.getElementById('advanceModal').classList.remove('hidden');
        }
        function closeAdvanceModal() { document.getElementById('advanceModal').classList.add('hidden'); }
        function saveAdvancePayment() {
            let id = parseInt(document.getElementById('advMemberId').value);
            let advMonths = parseInt(document.getElementById('advMonthsCount').value) || 1;
            let key = `${appData.currentMonth}_${id}`;
            appData.savings[key] = { paid: true, advanceMonths: advMonths };
            closeAdvanceModal();
            saveAppData();
            alert(`Successfully recorded ₹${500 * (advMonths + 1)} including ${advMonths} month(s) advance!`);
        }

        function openMemberModal(id = null) {
            if (appData.currentUser.role !== 'admin') return;
            if (id) {
                let m = appData.members.find(x => x.id === id);
                document.getElementById('editMemberId').value = m.id;
                document.getElementById('memberInputName').value = m.name;
                document.getElementById('memberInputAge').value = m.age || 30;
                document.getElementById('memberInputPhone').value = m.phone;
                document.getElementById('memberInputPin').value = m.pin || "1234";
                document.getElementById('memberInputPhoto').value = sanitizePhotoUrl(m.photo);
                document.getElementById('memberInputJoinMonth').value = m.joinMonth || "2026-01";
                document.getElementById('memberModalTitle').innerText = "Edit Member Details";
            } else {
                document.getElementById('editMemberId').value = "";
                document.getElementById('memberInputName').value = "";
                document.getElementById('memberInputAge').value = "";
                document.getElementById('memberInputPhone').value = "";
                document.getElementById('memberInputPin').value = "1234";
                document.getElementById('memberInputPhoto').value = "";
                document.getElementById('memberInputJoinMonth').value = appData.currentMonth;
                document.getElementById('memberModalTitle').innerText = "Add New Member";
            }
            document.getElementById('memberModal').classList.remove('hidden');
        }

        function closeMemberModal() { document.getElementById('memberModal').classList.add('hidden'); }

        function saveMemberData() {
            let id = document.getElementById('editMemberId').value;
            let name = document.getElementById('memberInputName').value.trim();
            let age = parseInt(document.getElementById('memberInputAge').value) || 25;
            let phone = document.getElementById('memberInputPhone').value.trim();
            let pin = document.getElementById('memberInputPin').value.trim() || "1234";
            let photo = sanitizePhotoUrl(document.getElementById('memberInputPhoto').value);
            let joinMonth = document.getElementById('memberInputJoinMonth').value || "2026-01";
            
            if (!name || !phone || !pin) { alert('Naam, phone number aur PIN bharein.'); return; }

            if (id) {
                let m = appData.members.find(x => x.id === parseInt(id));
                if (m) { 
                    m.name = name; 
                    m.age = age;
                    m.phone = phone; 
                    m.pin = pin;
                    m.photo = photo;
                    m.joinMonth = joinMonth; 
                    alert(`Member "${name}" update ho gaya hai!`);
                }
            } else {
                let newId = appData.members.length > 0 ? Math.max(...appData.members.map(m => m.id)) + 1 : 1;
                appData.members.push({ id: newId, name, age, phone, pin, photo, joinMonth });
                alert(`Naya member "${name}" add ho gaya hai!`);
            }
            closeMemberModal();
            saveAppData();
        }

        function deleteMember(id, name) {
            if (appData.currentUser.role !== 'admin') return;
            if (confirm(`Kya aap "${name}" ko delete karna chahte hain?`)) {
                appData.members = appData.members.filter(m => m.id !== id);
                alert(`Member delete ho gaya hai.`);
                saveAppData();
            }
        }

        function deleteLoan(id) {
            if (appData.currentUser.role !== 'admin') return;
            if (confirm('Kya aap is loan entry ko delete karna chahte hain? (Principal aur Interest repayments mein koi badlav nahi hoga aur loan Deleted Items mein dikhega.)')) {
                const loan = appData.loans.find(l => l.id === id);
                if (loan) {
                    loan.deleted = true;
                    loan.deletedAt = new Date().toISOString().split('T')[0];
                    saveAppData();
                }
            }
        }

        function openEditLoanModal(id) {
            if (appData.currentUser.role !== 'admin') return;
            const loan = appData.loans.find(l => l.id === id);
            if (!loan) return;

            const repaidPrincipal = (loan.repayments || []).reduce((sum, r) => r.type === 'Principal' ? sum + r.amount : sum, 0);
            const repaidInterest = (loan.repayments || []).reduce((sum, r) => r.type === 'Interest' ? sum + r.amount : sum, 0);

            document.getElementById('editLoanId').value = loan.id;
            document.getElementById('editLoanMemberLabel').innerText = `Member: ${loan.memberName} (Issue Date: ${loan.date || '-'})`;
            document.getElementById('editLoanAmount').value = loan.amount;
            document.getElementById('editLoanRate').value = loan.rate;
            document.getElementById('editLoanTotalPrincipal').value = repaidPrincipal;
            document.getElementById('editLoanTotalInterest').value = repaidInterest;
            document.getElementById('editLoanModal').classList.remove('hidden');
        }

        function closeEditLoanModal() {
            document.getElementById('editLoanModal').classList.add('hidden');
        }

        function saveEditedLoan() {
            if (appData.currentUser.role !== 'admin') return;
            const loanId = parseInt(document.getElementById('editLoanId').value);
            const amount = parseFloat(document.getElementById('editLoanAmount').value);
            const rate = parseFloat(document.getElementById('editLoanRate').value);
            const targetPrincipal = parseFloat(document.getElementById('editLoanTotalPrincipal').value);
            const targetInterest = parseFloat(document.getElementById('editLoanTotalInterest').value);

            if (isNaN(amount) || amount <= 0 || isNaN(rate) || isNaN(targetPrincipal) || targetPrincipal < 0 || isNaN(targetInterest) || targetInterest < 0) {
                alert('Kripya sabhi valid values bharein.');
                return;
            }

            const loan = appData.loans.find(l => l.id === loanId);
            if (!loan) return;

            const todayStr = new Date().toISOString().split('T')[0];
            const otherRepayments = (loan.repayments || []).filter(r => r.type !== 'Principal' && r.type !== 'Interest');
            const updatedRepayments = [...otherRepayments];

            if (targetPrincipal > 0) {
                updatedRepayments.push({ date: todayStr, amount: targetPrincipal, type: 'Principal' });
            }
            if (targetInterest > 0) {
                updatedRepayments.push({ date: todayStr, amount: targetInterest, type: 'Interest' });
            }

            loan.amount = amount;
            loan.rate = rate;
            loan.repayments = updatedRepayments;
            loan.status = (amount - targetPrincipal) <= 0 ? 'Settled' : 'Active';

            closeEditLoanModal();
            saveAppData();
        }

        function updateEmiPreview() {
            let amt = parseFloat(document.getElementById('loanAmount').value) || 0;

            document.getElementById('emiPreviewNotice').innerHTML = `💡 Monthly Interest Payment Preview: <b>₹${monthlyInterest} / month</b>`;
        }

        function openLoanModal() {
            if (appData.currentUser.role !== 'admin') return;
            document.getElementById('loanDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('loanModal').classList.remove('hidden');
            if (appData.members.length > 0) checkLoanEligibility(appData.members[0].name);
        }
        function closeLoanModal() { document.getElementById('loanModal').classList.add('hidden'); }

        function checkLoanEligibility(memberName) {
            let member = appData.members.find(m => m.name === memberName);
            let memberPaidCount = 0;
            if (member) {
                Object.keys(appData.savings).forEach(k => {
                    if (k.endsWith(`_${member.id}`)) {
                        let val = appData.savings[k];
                        if (val === true) memberPaidCount++;
                        else if (typeof val === 'object' && val.paid) {
                            memberPaidCount += (1 + (val.advanceMonths || 0));
                        }
                    }
                });
            }
            let totalSavings = memberPaidCount * 500;
            let maxLimit = totalSavings * 3;
            document.getElementById('eligibilityNotice').innerHTML = `💡 <b>Eligibility:</b> ${escapeAttr(memberName)} ki total savings ₹${totalSavings} hai. Max recommended loan limit: <b>₹${maxLimit}</b> (3x)`;
        }

        function saveNewLoan() {
            let memberName = document.getElementById('loanMember').value;
            let amount = parseFloat(document.getElementById('loanAmount').value);
            let rate = parseFloat(document.getElementById('loanRate').value);
            let date = document.getElementById('loanDate').value || new Date().toISOString().split('T')[0];
            if (!amount) { alert('Loan amount dalein.'); return; }
            appData.loans.push({ id: Date.now(), memberName, amount, rate, date, status: "Active", deleted: false, repayments: [] });
            closeLoanModal();
            saveAppData();
        }

        function openRepaymentModal(id) { 
            if (appData.currentUser.role !== 'admin') return;
            const loan = appData.loans.find(l => l.id === id);
            document.getElementById('repayLoanId').value = id;
            document.getElementById('repayLoanMemberLabel').innerText = loan ? `Member: ${loan.memberName} (Loan: ₹${loan.amount})` : "";
            document.getElementById('repayPrincipalAmount').value = "";
            document.getElementById('repayInterestAmount').value = "";
            document.getElementById('repaymentModal').classList.remove('hidden'); 
        }
        function closeRepaymentModal() { document.getElementById('repaymentModal').classList.add('hidden'); }
        function saveRepayment() {
            if (appData.currentUser.role !== 'admin') return;
            const loanId = parseInt(document.getElementById('repayLoanId').value);
            const principalRaw = document.getElementById('repayPrincipalAmount').value.trim();
            const interestRaw = document.getElementById('repayInterestAmount').value.trim();
            const principalAmt = principalRaw === "" ? 0 : parseFloat(principalRaw);
            const interestAmt = interestRaw === "" ? 0 : parseFloat(interestRaw);

            if (isNaN(principalAmt) || principalAmt < 0 || isNaN(interestAmt) || interestAmt < 0) {
                alert('Kripya valid amount dalein (0 ya usse bada).');
                return;
            }
            if (principalAmt <= 0 && interestAmt <= 0) {
                alert('Principal ya Interest mein se kam se kam ek mein 0 se bada amount dalein.');
                return;
            }

            const loan = appData.loans.find(l => l.id === loanId);
            if (loan) {
                if (!Array.isArray(loan.repayments)) loan.repayments = [];
                const todayStr = new Date().toISOString().split('T')[0];
                if (principalAmt > 0) {
                    loan.repayments.push({ date: todayStr, amount: principalAmt, type: 'Principal' });
                }
                if (interestAmt > 0) {
                    loan.repayments.push({ date: todayStr, amount: interestAmt, type: 'Interest' });
                }
                const repaidPrincipal = loan.repayments.reduce((sum, r) => r.type === 'Principal' ? sum + r.amount : sum, 0);
                if (loan.amount - repaidPrincipal <= 0) loan.status = 'Settled';
            }
            closeRepaymentModal();
            saveAppData();
        }

        function downloadPDFReceipt(loanId) {
            let loan = appData.loans.find(l => l.id === loanId);
            if (!loan) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(16, 185, 129);
            doc.rect(0, 0, 210, 32, "F");
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.text("Amari Bachat | Amari Suraksha - Receipt", 14, 21);

            doc.setTextColor(50, 50, 50);
            doc.setFontSize(11);
            doc.text(`Member Name: ${loan.memberName}`, 14, 45);
            doc.text(`Loan Amount: Rs. ${loan.amount}`, 14, 53);
            doc.text(`Interest Rate: ${loan.rate}% per month`, 14, 61);
            doc.text(`Issue Date: ${loan.date}`, 14, 69);

            let rows = (loan.repayments || []).map(r => [r.date, `Rs. ${r.amount}`, r.type]);
            doc.autoTable({
                head: [['Date', 'Amount Paid', 'Type (Principal/Interest)']],
                body: rows,
                startY: 78
            });
            doc.save(`Receipt_${loan.memberName.replace(/\s+/g, '_')}.pdf`);
        }

        function renderAuditTab() {

                                                </td>
                                                <td class="p-3 text-slate-300">${m.age || 'N/A'} yrs</td>
                                                <td class="p-3 text-indigo-300 text-xs font-medium">${formatMonthMMYYYY(joinM)}</td>
                                                <td class="p-3 text-emerald-400 font-medium">₹${mSavings}</td>
                                                <td class="p-3 text-amber-400 font-medium">+ ₹${memberProfitShare}</td>
                                                <td class="p-3 text-right font-bold text-indigo-300 text-base">₹${finalNetWorth}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQueriesTab() {
            const isAdmin = appData.currentUser.role === 'admin';
            const memberName = isAdmin ? null : appData.currentUser.name;
            const filtered = isAdmin ? appData.queries : appData.queries.filter(q => q.memberName === memberName);

            return `
                <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 space-y-6 shadow-xl">
                    <div>
                        <h2 class="text-xl font-bold text-white">અમારી બચત | અમારી સુરક્ષા - Member Queries</h2>
                        <p class="text-xs text-slate-400">Members apnay sawaal ya request yahan post kar sakte hain.</p>
                    </div>

                    ${!isAdmin ? `
                        <div class="bg-slate-800/40 border border-slate-700/50 p-4 rounded-2xl space-y-3">
                            <h3 class="text-sm font-semibold text-emerald-300">Naya Sawaal Bhejein</h3>
                            <textarea id="queryText" rows="3" placeholder="Apna message yahan likhein..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none"></textarea>
                            <button onclick="submitQuery()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition">Send Query</button>
                        </div>
                    ` : ''}

                    <div class="space-y-4">
                        ${filtered.length === 0 ? `<p class="text-slate-400 text-sm italic">Koi query uplabdh nahi hai.</p>` : ''}
                        ${filtered.slice().reverse().map(q => `
                            <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl space-y-2">
                                <div class="flex justify-between items-center text-xs text-slate-400">
                                    <span class="font-semibold text-indigo-300">👤 ${escapeAttr(q.memberName)}</span>
                                    <span>📅 ${escapeAttr(q.date)}</span>
                                </div>
                                <p class="text-sm text-white font-medium">${escapeAttr(q.text)}</p>
                                ${q.reply ? `<div class="bg-indigo-950/50 border border-indigo-500/30 p-3 rounded-xl mt-2 text-xs"><span class="font-bold text-indigo-400 block mb-1">👑 Admin Reply:</span><p class="text-slate-200">${escapeAttr(q.reply)}</p></div>` : ''}
                                ${isAdmin && !q.reply ? `<div class="pt-2 flex gap-2"><input type="text" id="reply_${q.id}" placeholder="Admin reply..." class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none"><button onclick="sendReply(${q.id})" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs">Reply</button></div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function submitQuery() {
            let text = document.getElementById('queryText').value.trim();
            if (!text) { alert('Message likhein.'); return; }
            appData.queries.push({ id: Date.now(), memberName: appData.currentUser.name, text, date: new Date().toISOString().split('T')[0], reply: "" });
            saveAppData();
        }

        function sendReply(qid) {
            let replyText = document.getElementById(`reply_${qid}`).value.trim();
            if (!replyText) { alert('Reply likhein.'); return; }
            let q = appData.queries.find(x => x.id === qid);
            if (q) { q.reply = replyText; }
            saveAppData();
        }

        render();
    </script>
</body>
</html>
